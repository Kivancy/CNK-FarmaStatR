# CNK-FarmaStatR · automatic integrity check on every push.
# Not a re-validation: it shows that the validated models are unchanged and
# still reproduce their documented results (project instructions, "Validasyon").
#   Step 1: SHA-256 of the 13 pinned files must match CEKIRDEK_SHA256.txt
#           (8 inherited validated cores; 5 simulation files, FSR-VAL-SIM-1 1.0)
#   Step 2: install the package and run the whole test folder: inherited
#           validation (491 checks: MSD 60, Weibull 98, f2 120, PBE 213),
#           simulation framework TC-S1...S10, in vitro engine TC-F1...F11,
#           platform input check PLT-IN-1...5, hypothesis classification
#           (H-5, H-6, H-7, K-1; FSR-TN-PLT-02) and R script export
#           (E-1, E-3 ... E-9; FSR-TN-PLT-03) and the display-rule reference
#           (P4-K3, Linux only; FSR-TN-PLT-04) and design selection
#           (D-1: Tables 11.3a/b of FSR-TN-PBE-01 reproduced; D-5 design script;
#           FSR-TN-PLT-05) and the analysis screen's reader and bridges
#           (A-1 ... A-8: dis_kopru.R = G-01, screen path = bridge; FSR-TN-PLT-06)
#           and the EMA 90% CI analysis (A-9 ... A-11: platform_ema = ema_ci_fast,
#           paths a/b in base R, c vs numerical REML; FSR-TN-PLT-08, KK-64)
#           (testthat: 61 blocks, 2328 expectations on 22.10.2026; Windows 2323
#           expected)
#   Step 3: grid checks of P2 on the simulation results in the repository
#           (H-1...H-4, S-3, S-4, K-1 ii/iv; FSR-TN-PLT-02, KK-50 A-1)
# Runs on Linux and on Windows (the user's platform).

name: dogrulama

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      NOT_CRAN: "true"   # also run the bootstrap f2 tests (skip_on_cran)

    steps:
      - uses: actions/checkout@v5

      - name: UTF-8 locale (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "LANG=C.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=C.UTF-8" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install testthat
        shell: Rscript {0}
        run: install.packages("testthat")

      - name: "Step 1: validated core files unchanged (SHA-256)"
        shell: Rscript {0}
        run: |
          source("araclar/cekirdek_kontrol.R")
          if (!all(liste$durum == "AYNI")) quit(status = 1)

      - name: Install CNKfarmastatr
        shell: bash
        run: R CMD INSTALL CNKfarmastatr

      - name: "Step 2: package tests (inherited validation, TC-S, TC-F)"
        shell: Rscript {0}
        run: |
          res <- testthat::test_dir("CNKfarmastatr/tests/testthat",
                                    package = "CNKfarmastatr",
                                    load_package = "installed",
                                    reporter = "summary",
                                    stop_on_failure = TRUE)
          df <- as.data.frame(res)
          cat("\nExpectations:", sum(df$nb), " Failed:", sum(df$failed),
              " Skipped:", sum(df$skipped), "\n")
          if (sum(df$skipped) > 0) quit(status = 1)   # every test must run
          sessionInfo()

      - name: "Step 3: P2 grid checks (H-1...H-4, S-3, S-4, K-1 ii/iv)"
        shell: Rscript {0}
        run: |
          out <- "belgeler/teknik_notlar/FSR-TN-PLT-02_ek/p2_kabul_t1.csv"
          unlink(out)                                 # never read a committed result
          source("belgeler/teknik_notlar/FSR-TN-PLT-02_ek/p2_kabul.R", encoding = "UTF-8", local = new.env())
          r <- utils::read.csv(out, encoding = "UTF-8")
          if (nrow(r) != 8 || !all(r$sonuc == "GECTI")) quit(status = 1)
